id: all_elasticsearch
namespace: sanitychecks.plugin-elasticsearch

tasks:
  - id: init
    type: io.kestra.plugin.core.output.OutputValues
    values:
      randomPort: "{{ randomPort() }}"

  - id: dockerStart
    type: io.kestra.plugin.docker.Run
    containerImage: docker.elastic.co/elasticsearch/elasticsearch:8.17.2
    env:
      discovery.type: single-node
      xpack.security.enabled: "false"
    portBindings:
      - "{{ outputs.init.values.randomPort }}:9200"
    wait: false

  - id: wait_elasticsearch
    type: io.kestra.plugin.core.http.Request
    uri: "http://localhost:{{ outputs.init.values.randomPort }}/_cluster/health?wait_for_status=yellow&timeout=5s"
    retry:
      type: constant
      interval: PT3S
      maxDuration: PT3M
      warningOnRetry: false

  - id: loop
    type: io.kestra.plugin.core.flow.Loop
    values: ["bulk","esql","load","put_get","request","scroll","searching"]
    concurrencyLimit: 0
    tasks:
      - id: subflow
        type: io.kestra.plugin.core.flow.Subflow
        namespace: "{{ flow.namespace }}"
        flowId: "{{ item.value }}"
        wait: true
        transmitFailed: true
        inputs:
          cs: "http://localhost:{{ outputs.init.values.randomPort }}"

finally:
  - id: dockerStop
    type: io.kestra.plugin.docker.Stop
    containerId: "{{ outputs.dockerStart.taskRunner.containerId }}"
